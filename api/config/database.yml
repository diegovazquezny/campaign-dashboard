# PostgreSQL. Connection settings come from DATABASE_URL (which takes
# precedence when set) or the standard PG* environment variables, with
# localhost defaults for native development.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", ENV["USER"]) %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: campaign_dashboard_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: campaign_dashboard_test

production:
  <<: *default
  database: campaign_dashboard_production
