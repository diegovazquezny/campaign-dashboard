services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    ports:
      # Host port is overridable (e.g. DB_PORT=5433) if 5432 is already in use.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    # Remove a stale server.pid left by a previous container, or Rails refuses to boot.
    command: bash -c "bin/rails db:prepare db:seed && rm -f tmp/pids/server.pid && bin/rails s -b 0.0.0.0 -p 3001"
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_DIR: /data
    volumes:
      - ./api:/rails
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./dashboard-ui
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:3001
    depends_on:
      - api

volumes:
  db_data:
